# kbx voice: every ALSA program (Claude's arecord, Codex's voice helper) uses
# the sandbox's PulseAudio server, whose microphone and speaker the host
# connects while a session is attached.
pcm.!default {
	type pulse
	hint.description "kbx voice (host microphone and speakers while attached)"
}
ctl.!default {
	type pulse
}
